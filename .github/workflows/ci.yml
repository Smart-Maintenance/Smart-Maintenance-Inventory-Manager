name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -m pip check
      - run: ruff check backend
      - run: pytest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
  container:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Check API and persistence
        shell: bash
        run: |
          set -euo pipefail
          curl --fail http://127.0.0.1:8000/health/ready
          curl --fail http://127.0.0.1:8000/openapi.json > /dev/null
          docker compose exec -T backend python -c "from pathlib import Path; Path('/data/persistence-check').write_text('ok')"
          docker compose down
          docker compose up --detach --wait --wait-timeout 120
          docker compose exec -T backend python -c "from pathlib import Path; assert Path('/data/persistence-check').read_text() == 'ok'; Path('/data/persistence-check').unlink()"
      - run: docker compose logs --no-color
        if: always()
      - run: docker compose down --volumes
        if: always()
