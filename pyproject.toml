[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-v -ra --junitxml=reports/junit.xml --html=reports/tests.html --self-contained-html --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html:reports/coverage --cov-fail-under=70"

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
